name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # State-plane database for the Postgres store integration tests
      # (TEST_DATABASE_URL-gated; skipped when unset).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openhealth-dev
          POSTGRES_DB: openhealth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:openhealth-dev@localhost:5432/openhealth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: apply state-plane migrations
        run: |
          for m in 0001_init 0002_telehealth_equipment 0003_pharmacy \
                   0003_sync_docs 0004_notifications 0005_registry_kyc \
                   0006_wallet_idempotency; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "db/migrations/$m.sql"
          done
      - name: gofmt gate
        run: |
          out=$(gofmt -l services shared)
          test -z "$out" || { echo "not gofmt-clean:"; echo "$out"; exit 1; }
      - name: vet and test shared modules
        run: |
          for m in authz servex crdt eventbus otelx sealx eventschema; do
            echo "== shared/$m =="
            (cd "shared/$m" && go vet ./... && go test ./...)
          done
      - name: vet and test tools
        run: |
          for t in ota ipsqr provcred; do
            echo "== tools/$t =="
            (cd "tools/$t" && go vet ./... && go test ./...)
          done
      - name: vet and test all Go modules
        run: |
          set -e
          for m in api-gateway claims-orchestrator payment-switch-mock registry-service sync-agent sync-ingest consent-service ussd-gateway wallet-service equipment-service telehealth-service shr-service pharmacy-service notification-service lga-hub; do
            echo "== $m =="
            (cd "services/$m" && go vet ./... && go test ./...)
          done

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ledger tests
        run: cargo test --manifest-path services/ledger/Cargo.toml
      - name: telemetry-collector tests
        run: cargo test --manifest-path services/telemetry-collector/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: unit tests (stdlib-only packages)
        run: |
          python3 -m unittest discover -s packages/adjudicator
          python3 -m unittest discover -s packages/triage
          python3 -m unittest discover -s packages/dhis2-bridge
          python3 -m unittest discover -s packages/procurement
          python3 -m unittest discover -s packages/analytics
          python3 -m unittest discover -s packages/chw-tasks
          python3 -m unittest discover -s packages/lis-bridge
          python3 -m unittest discover -s packages/fhir-validate
          python3 -m unittest discover -s packages/adapters
          python3 -m unittest discover -s packages/auditlake
          python3 -m unittest discover -s packages/lakehouse
          python3 -m unittest discover -s packages/replay
          python3 -m unittest discover -s packages/costguard
          python3 -m unittest discover -s packages/erpnext-bridge
          python3 -m unittest discover -s packages/ips
          python3 -m unittest discover -s packages/surveillance
          python3 -m unittest discover -s packages/frauddetect
          python3 -m unittest discover -s packages/households
          python3 -m unittest discover -s packages/payrails
          python3 -m unittest discover -s packages/coldchain
          python3 -m unittest discover -s packages/edgeai
          python3 -m unittest discover -s tools/syncbench
          python3 -m unittest discover -s tools -p "test_a11y*.py"
          python3 -m unittest discover -s benchmark
          python3 benchmark/million_claims.py --claims 50000 > /dev/null  # invariant-checked benchmark run

  fhir-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: validate FHIR profiles
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          bad = []
          for p in glob.glob("fhir/profiles/*.json"):
              d = json.load(open(p))
              ok = (d.get("resourceType") == "StructureDefinition"
                    and d.get("url", "").startswith("https://openhealthos.org/fhir/")
                    and d.get("derivation") == "constraint"
                    and d.get("fhirVersion") == "4.0.1")
              if not ok:
                  bad.append(p)
          if bad:
              sys.exit(f"non-conformant profiles: {bad}")
          print(f"validated {len(glob.glob('fhir/profiles/*.json'))} profiles")
          EOF
      - name: validate example resources against profiles (positive + negative)
        run: |
          set -e
          for f in fhir/examples/patient-valid.json fhir/examples/claim-valid.json fhir/examples/encounter-valid.json fhir/examples/consent-valid.json; do
            python3 packages/fhir-validate/validate.py "$f"
          done
          for f in fhir/examples/patient-invalid.json fhir/examples/claim-invalid.json; do
            ! python3 packages/fhir-validate/validate.py "$f" || { echo "$f should have failed validation"; exit 1; }
          done
          echo "example validation: positives pass, negatives rejected" 

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: dtolnay/rust-toolchain@stable
      - name: run the end-to-end demo and assert verdicts
        run: |
          DEMO_PORT=18280 demo/demo.sh | tee /tmp/demo.out
          grep -q '"decision": "APPROVE"' /tmp/demo.out
          grep -q '"decision": "PEND"' /tmp/demo.out
          grep -q '"preauth_id": "PA-' /tmp/demo.out
          echo "e2e demo: approve / pend / preauth all observed"
      - name: clinical loop smoke (telehealth → SHR → pharmacy → claim draft)
        run: |
          bash demo/clinical-loop.sh | tee /tmp/loop.out
          grep -q "pharmacy_routed: True" /tmp/loop.out
          grep -q "intent: order" /tmp/loop.out
          grep -q "encounter status: finished" /tmp/loop.out
          grep -q "claim draft ₦ 2880" /tmp/loop.out
          grep -q "AL8020: 76" /tmp/loop.out
          grep -q "allergy:penicillin blocks AMOX500" /tmp/loop.out
          grep -q "CLINICAL LOOP OK" /tmp/loop.out
          echo "clinical loop: prescribe / SHR / dispense / allergy-gate all observed"
      - name: national sync smoke (facility → LGA hub → state plane)
        run: |
          bash demo/national-sync.sh | tee /tmp/sync.out
          grep -q "priority order OK" /tmp/sync.out
          grep -q "restart clean" /tmp/sync.out
          grep -q "NATIONAL SYNC OK" /tmp/sync.out
          echo "national sync: priority queues / spill durability / dedupe all observed"

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: PWA CRDT tests
        run: node --test apps/pwa/tests/
      - name: dashboard data-transform tests (pilot-gate math)
        run: node --test apps/dashboards/tests/
      - name: patient app logic tests (feed grouping, relative time)
        run: node --test apps/patient/tests/
      - name: app shells are self-contained (no external runtime deps)
        run: |
          # Offline-first means zero CDN/fonts/scripts fetched at runtime.
          ! grep -rnE "https?://[^\"']*" apps/pwa/index.html apps/dashboards/index.html \
              apps/patient/index.html apps/pwa/css apps/dashboards/css apps/patient/css \
            | grep -vE "W3.org|webmanifest|schema" \
            || { echo "external runtime reference found — apps must be self-contained"; exit 1; }
          echo "app shells: self-contained"

  openhie-conformance:
    # ADR-0013: the federation contract (consent gate, FHIR surfaces) and
    # the Medplum subscription intake are gated on every push. The Medplum
    # gate runs in selftest here (mock Medplum, real notification rail);
    # medplum-gate.yml runs the same harness against a real Medplum server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: build the federation services
        run: |
          go build -o /tmp/registry-service ./services/registry-service
          go build -o /tmp/consent-service ./services/consent-service
          go build -o /tmp/shr-service ./services/shr-service
          go build -o /tmp/notification-service ./services/notification-service
      - name: boot the federation
        run: |
          LISTEN=:18081 /tmp/registry-service &>/tmp/reg.log &
          LISTEN=:18082 /tmp/consent-service &>/tmp/cons.log &
          LISTEN=:18085 CONSENT_URL=http://127.0.0.1:18082 /tmp/shr-service &>/tmp/shr.log &
          LISTEN=:18090 /tmp/notification-service &>/tmp/ntf.log &
          for port in 18081 18082 18085 18090; do
            for i in $(seq 1 20); do
              curl -sf "http://127.0.0.1:$port/healthz" >/dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/healthz" >/dev/null || { cat /tmp/reg.log /tmp/cons.log /tmp/shr.log /tmp/ntf.log; exit 1; }
          done
      - name: OpenHIE-pattern conformance (consent gate must not leak)
        run: |
          python3 tools/conformance/conformance.py \
            --registry http://127.0.0.1:18081 --shr http://127.0.0.1:18085 \
            --consent http://127.0.0.1:18082
      - name: Medplum gate (selftest — harness proof; real server in medplum-gate.yml)
        run: |
          python3 tools/conformance/medplum_gate.py --selftest \
            --openhealth http://127.0.0.1:18090

  licence-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no prohibited licences in dependency manifests (LICENSING.md policy)
        run: |
          ! grep -rniE '"(license|licence)"\s*:\s*"(BSL|BUSL|SSPL|Elastic)' \
            --include=package.json --include=Cargo.toml --include=go.mod \
            --include=pyproject.toml . \
            || (echo "prohibited licence found — re-implement, never embed (ADR-0005)" && exit 1)
          echo "licence hygiene: clean"
