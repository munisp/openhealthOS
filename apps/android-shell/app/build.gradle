plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.openhealthos.shell"
    compileSdk 34

    defaultConfig {
        applicationId "org.openhealthos.shell"
        minSdk 24            // Android 7.0 (2016) — five-year-old phones are the target
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.webkit:webkit:1.10.0"   // ServiceWorkerController on old WebViews
}
