<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traveler medical pass — OpenHealth OS</title>
<link rel="stylesheet" href="../design-tokens.css">
<style>
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#f7f7f7; color:#09352e; }
  header { background:#fff; border-bottom:1px solid rgba(0,0,0,.1); padding:12px 18px;
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:1.05rem; margin:0; flex:1; }
  main { max-width:880px; margin:0 auto; padding:14px; display:grid; gap:14px; }
  .card { background:#fff; border-radius:var(--oh-radius-lg); padding:14px;
          box-shadow:var(--oh-shadow-sm); border:1px solid var(--oh-card-border); }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px;
          font-size:.75rem; font-weight:700; }
  .green { background:#e6f3ea; color:#007f24; } .orange { background:#fff4d6; color:#8a5a00; }
  .blue { background:#e8f0fe; color:#2b5c9e; }
  label { font-size:.8rem; font-weight:600; display:block; margin-top:8px; }
  input, select, textarea { padding:9px 10px; border:1px solid #ddd; border-radius:10px;
           font-size:.95rem; width:100%; box-sizing:border-box; margin-top:4px; }
  button { background:#007f24; color:#fff; border:none; border-radius:10px;
           padding:10px 14px; font-weight:700; cursor:pointer; margin-top:10px; }
  button.ghost { background:#eef2ff; color:#4f46e5; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:700px){ .grid2 { grid-template-columns:1fr; } }
  #qr { text-align:center; padding:12px; }
  #qr img, #qr canvas { margin:0 auto; display:block; }
  .mono { font-family: ui-monospace, monospace; font-size:.75rem; word-break:break-all;
          color:#54655f; }
  .err { background:#fdeceb; color:#b3261e; padding:8px 12px; border-radius:10px;
         font-size:.85rem; display:none; }
  .ok { background:#e6f3ea; color:#007f24; padding:8px 12px; border-radius:10px;
        font-size:.85rem; display:none; }
</style>
</head>
<body>
<header>
  <h1>Traveler medical pass</h1>
  <select id="profileSel" style="width:auto" title="country profile"></select>
  <span class="pill blue" id="policyPill"></span>
</header>
<main>
  <section class="card">
    <strong>1 · Enroll</strong>
    <div class="grid2">
      <div><label>Full name</label><input id="name"></div>
      <div><label>Passport reference</label><input id="passport"></div>
      <div><label>Nationality</label><input id="nat"></div>
      <div><label>Age (years)</label><input id="age" type="number" min="0"></div>
      <div><label>Blood group (if known)</label>
        <select id="bg"><option value="">not recorded</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select></div>
      <div><label>Entry day</label><input id="entry" type="number" value="0"></div>
      <div><label>Exit day</label><input id="exit" type="number" value="13"></div>
    </div>
    <label>Allergies (comma separated)</label><input id="allergies">
    <label>Conditions</label><input id="conditions">
    <label>Medications</label><input id="meds">
    <label>Emergency contact (name — phone)</label><input id="contact">
    <button id="enroll">Enroll</button>
    <div class="err" id="err1"></div>
  </section>

  <section class="card">
    <strong>2 · Pay the insurance fee</strong>
    <div class="muted" id="premium">enroll first — the premium is assessed from the policy table</div>
    <div class="grid2">
      <div><label id="amountLabel">Amount</label><input id="amount" type="number"></div>
      <div><label>Method</label>
        <select id="method"><option>card</option><option>transfer</option>
          <option>cash</option><option>wallet</option></select></div>
    </div>
    <label>Payment reference</label><input id="ref" placeholder="bank/PSP reference">
    <button id="pay">Pay</button>
    <span class="pill green" id="covPill" style="display:none"></span>
    <div class="err" id="err2"></div>
  </section>

  <section class="card" id="passCard" style="display:none">
    <strong>3 · The pass</strong>
    <p class="muted">The QR carries a <em>key</em>, never the record. Show it at the
       border; an emergency provider scans it to open the emergency card.</p>
    <div id="qr"></div>
    <div class="mono" id="payload"></div>
    <button class="ghost" id="revoke">Report lost — revoke this pass</button>
    <div class="ok" id="ok3"></div>
  </section>
</main>
<!-- qrcode-generator (MIT, Kazuhiko Arase) referenced from upstream CDN
     at runtime, never vendored -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
/* Demo/offline model: the same doctrine as the engine, in-page. A
   deployment points these calls at the travelpass service.
   Country-agnostic: the active country profile is an ENTRY in
   PROFILES — selected by ?profile=<id> or the header selector —
   never an if-country branch. Mirrors VHC_PROFILES in
   packages/travelpass/vhcover.py; the versions are the lockstep. */
const $ = id => document.getElementById(id);

const CURRENCIES = {
  NGN: { symbol: "₦", minor: "kobo",     locale: "en-NG" },
  EUR: { symbol: "€", minor: "cents",    locale: "en-IE" },
  CVE: { symbol: "$", minor: "centavos", locale: "pt-CV" },
};

const MODELS = {
  flat_per_day: (p, days) => p.flat_fee_minor + p.per_day_minor * days,
  block:        (p, days) => Math.ceil(days / p.block_days) * p.block_price_minor,
};

const PROFILES = {
  "ng-vhc@1.0.0": {
    currency: "NGN", model: "flat_per_day",
    flat_fee_minor: 500000, per_day_minor: 50000,      // ₦5,000 + ₦500/day
    max_covered_days: 90,                              // beyond is residence
    age_bands: [{ max_age: null, factor: 1.0 }],
    alt_currency: null,
    er_url: "https://er.ng.gov/er#t=",
  },
  "cv-vhc@1.0.0": {
    currency: "EUR", model: "block",
    block_days: 30, block_price_minor: 2500,           // €25.00 per 30 days
    max_covered_days: null,
    age_bands: [{ max_age: 2, factor: 0.0 },
                { max_age: 12, factor: 0.5 },
                { max_age: null, factor: 1.0 }],
    alt_currency: { code: "CVE", peg: 110.265 },       // escudo, BCV peg
    er_url: "https://er.gov.cv/er#t=",
  },
};

/* price_cover() from vhcover.py, ported 1:1: model base from the MODELS
   entry, age factor from the profile's bands, round half-even. */
function ageFactor(p, age) {
  for (const b of p.age_bands) if (b.max_age === null || age <= b.max_age) return b.factor;
  return 1.0;
}
function priceCover(p, days, age) {
  return roundHalfEven(MODELS[p.model](p, days) * ageFactor(p, age));
}

function initialProfileId() {
  const q = new URLSearchParams(location.search).get("profile");
  return PROFILES[q] ? q : "ng-vhc@1.0.0";
}
let PROFILE_ID = initialProfileId();
const profile = () => PROFILES[PROFILE_ID];
const ccy = () => CURRENCIES[profile().currency];

function fmtMajor(minor) {
  const c = ccy(), major = minor / 100;
  return c.symbol + major.toLocaleString(c.locale, {
    minimumFractionDigits: minor % 100 ? 2 : 0, maximumFractionDigits: 2 });
}
function fmtMinor(minor) {
  const c = ccy();
  return minor.toLocaleString(c.locale) + " " + c.minor;
}
/* Escudo display off the BCV peg read from the profile — same algorithm
   as vhdemo._fmt_cve: truncate escudos, round centavos half-even,
   carry on rounding, thousands '.', '$' before the two decimals. */
function roundHalfEven(x) {
  const f = Math.floor(x), d = x - f;
  return d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
}
function fmtCVE(eurMinor) {
  const peg = profile().alt_currency.peg;
  const cve = eurMinor / 100 * peg;
  let esc = Math.trunc(cve);
  let cent = roundHalfEven((cve - esc) * 100);
  if (cent === 100) { esc += 1; cent = 0; }
  return String(esc).replace(/\B(?=(\d{3})+(?!\d))/g, ".")
       + "$" + String(cent).padStart(2, "0");
}
function fmtDue(minor) {
  let s = fmtMajor(minor) + " (" + fmtMinor(minor) + ")";
  if (profile().alt_currency) s += " ≈ " + fmtCVE(minor) + " CVE";
  return s;
}

function applyProfile() {
  const sel = $("profileSel");
  sel.innerHTML = "";
  for (const id of Object.keys(PROFILES)) {
    const o = document.createElement("option");
    o.value = id; o.textContent = id; sel.appendChild(o);
  }
  sel.value = PROFILE_ID;
  $("policyPill").textContent = "policy travel-medical-policy@1.0.0 · " + PROFILE_ID;
  $("amountLabel").textContent = "Amount (" + ccy().minor + ")";
}
$("profileSel") && applyProfile();
$("profileSel").onchange = () => {
  PROFILE_ID = $("profileSel").value;
  applyProfile();
  if (traveler) {   // re-quote the same stay under the new profile
    const days = traveler.exit - traveler.entry + 1;
    due = priceCover(profile(), days, traveler.age);
    $("premium").textContent = days + " covered days → premium " + fmtDue(due);
    $("amount").value = due;
  }
};

let traveler = null, paid = 0, due = 0;
function fail(el, msg){ $(el).style.display="block"; $(el).textContent=msg; }
$("enroll").onclick = () => {
  $("err1").style.display="none";
  const name = $("name").value.trim(), pp = $("passport").value.trim();
  if (!name || !pp) return fail("err1","name and passport reference are the record — a traveler without identity is a ticket number");
  const entry = +$("entry").value, exit = +$("exit").value;
  if (exit < entry) return fail("err1","exit before entry — time does not run backwards at the border");
  const ageRaw = $("age").value.trim();
  if (ageRaw === "" || +ageRaw < 0) return fail("err1","traveller age is required — absence is not a discount");
  const age = +ageRaw;
  const days = exit - entry + 1, cap = profile().max_covered_days;
  if (cap !== null && days > cap) return fail("err1","window beyond the tourism cap is residence, not cover");
  due = priceCover(profile(), days, age);
  traveler = { name, passport: pp, nat: $("nat").value.trim(), age,
               bg: $("bg").value, entry, exit, profile: PROFILE_ID,
               allergies: $("allergies").value.split(",").map(s=>s.trim()).filter(Boolean),
               conditions: $("conditions").value.split(",").map(s=>s.trim()).filter(Boolean),
               meds: $("meds").value.split(",").map(s=>s.trim()).filter(Boolean),
               contact: $("contact").value.trim() };
  localStorage.setItem("tp.traveler", JSON.stringify(traveler));
  $("premium").textContent = days + " covered days → premium " + fmtDue(due);
  $("amount").value = due;
};
$("pay").onclick = () => {
  $("err2").style.display="none";
  if (!traveler) return fail("err2","enroll first — the ledger needs the traveler");
  const amt = +$("amount").value, ref = $("ref").value.trim();
  if (amt <= 0) return fail("err2","a zero payment is not a payment");
  if (!ref) return fail("err2","a payment without a reference is cash in a pocket, not a receipt");
  paid += amt;
  const pill = $("covPill"); pill.style.display="inline-block";
  if (paid >= due) {
    pill.textContent = "coverage active";
    issuePass();
  } else {
    pill.textContent = "shortfall " + fmtMajor(due-paid) + " — a partial payment is a stated shortfall, not a silent discount";
    pill.className = "pill orange";
  }
};
function issuePass(){
  const bytes = new Uint8Array(24); crypto.getRandomValues(bytes);
  const token = "tp_" + btoa(String.fromCharCode(...bytes))
                  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const payload = profile().er_url + token;
  localStorage.setItem("tp.token", token);
  $("passCard").style.display = "block";
  $("payload").textContent = payload;
  const qr = qrcode(0, "M"); qr.addData(payload); qr.make();
  $("qr").innerHTML = qr.createImgTag(6, 8);
}
$("revoke").onclick = () => {
  localStorage.removeItem("tp.token");
  $("passCard").style.display = "none";
  $("ok3").style.display="block";
  $("ok3").textContent = "pass revoked — revocation is a security event, recorded with reason and name at the service";
};
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw-vhc.js").catch(()=>{});}</script>
</body>
</html>
