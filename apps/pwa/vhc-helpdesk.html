<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpdesk console — OpenHealth OS VHC</title>
<link rel="stylesheet" href="../design-tokens.css">
<style>
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#0d1312; color:#e8ecea; }
  header { background:#12324a; padding:12px 18px; }
  header h1 { font-size:1.05rem; margin:0; }
  header .meta { font-size:.75rem; color:#8aa39d; margin-top:4px; font-family:ui-monospace,monospace; }
  main { max-width:860px; margin:0 auto; padding:14px; display:grid; gap:14px; }
  .card { background:#161d1b; border:1px solid #2a3532; border-radius:12px; padding:16px; }
  .row { display:flex; justify-content:space-between; padding:8px 0;
         border-bottom:1px solid #243130; font-size:.95rem; }
  .row b { color:#9ec7ff; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th { text-align:left; color:#9ec7ff; font-size:.75rem; text-transform:uppercase;
       letter-spacing:.05em; padding:8px; border-bottom:2px solid #2a3532; }
  td { padding:8px; border-bottom:1px solid #243130; }
  .breach { color:#ff9d92; font-weight:700; }
  .clean { color:#7be3a3; }
  .err { background:#4a1512; color:#ff9d92; padding:10px 14px; border-radius:10px;
         font-size:.9rem; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>HELPDESK — a late response is a named breach with an owner</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div class="err" id="err"></div>
  <div class="card" id="summary"></div>
  <div class="card">
    <table>
      <thead><tr><th>Ticket</th><th>Channel</th><th>Category</th><th>Priority</th><th>State</th><th>Clocks</th></tr></thead>
      <tbody id="tickets"></tbody>
    </table>
  </div>
</main>
<script>
(async function () {
  const err = document.getElementById("err");
  let d;
  try {
    const resp = await fetch("vhc-helpdesk.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("vhc-helpdesk.json HTTP " + resp.status +
      " — generate it: bash demo/vhc-walkthrough.sh");
    d = await resp.json();
  } catch (e) { err.style.display = "block"; err.textContent = String(e.message || e); return; }

  document.getElementById("meta").textContent =
    d.version + " · sha256 " + d.sha256.slice(0, 16) + "…";

  const sla = d.first_response_sla;
  const states = Object.entries(d.by_state).map(function (kv) {
    return kv[0] + ": " + kv[1];
  }).join(" · ");
  document.getElementById("summary").innerHTML =
    '<div class="row"><b>tickets</b><span>' + d.tickets_total + "</span></div>" +
    '<div class="row"><b>by state</b><span>' + states + "</span></div>" +
    '<div class="row"><b>first response in SLA</b><span>' + sla.compliant +
      " / " + sla.responded + " responded</span></div>" +
    '<div class="row"><b>open breaches</b><span class="' +
      (d.open_breaches ? "breach" : "clean") + '">' + d.open_breaches + "</span></div>";

  document.getElementById("tickets").innerHTML = d.tickets.map(function (t) {
    const clocks = t.breaches.length
      ? '<span class="breach">breach: ' + t.breaches.join(", ") + "</span>"
      : '<span class="clean">in SLA</span>';
    return "<tr><td>" + t.ticket_id + "</td><td>" + t.channel + "</td><td>" +
           t.category + "</td><td>" + t.priority + "</td><td>" + t.state +
           "</td><td>" + clocks + "</td></tr>";
  }).join("");
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw-vhc.js").catch(()=>{});}</script>
</body>
</html>
