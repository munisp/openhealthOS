<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHC demo board — OpenHealth OS</title>
<link rel="stylesheet" href="../design-tokens.css">
<style>
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#0d1312; color:#e8ecea; }
  header { background:#12324a; padding:12px 18px; }
  header h1 { font-size:1.05rem; margin:0; }
  header .meta { font-size:.75rem; color:#8aa39d; margin-top:4px; }
  main { max-width:860px; margin:0 auto; padding:14px; display:grid; gap:14px; }
  .disclaimer { background:#161d1b; border:1px solid #2a3532; border-radius:10px;
                padding:10px 14px; font-size:.85rem; color:#b9c8c4; font-style:italic; }
  .red { background:#4a1512; color:#ff9d92; border:2px solid #d1451d; border-radius:12px;
         padding:16px; font-weight:700; }
  .scene { background:#161d1b; border:1px solid #2a3532; border-radius:12px; padding:16px; }
  .scene h2 { margin:0 0 4px; font-size:1.1rem; }
  .scene .num { color:#7be3a3; font-weight:800; margin-right:8px; }
  .surface { font-size:.8rem; color:#8aa39d; margin-bottom:8px; }
  .surface a { color:#9ec7ff; text-decoration:none; font-weight:600; }
  .surface a:hover { text-decoration:underline; }
  .unwired { color:#d19a1d; font-size:.8rem; }
  ul { margin:8px 0 0; padding-left:18px; }
  li { margin:6px 0; font-size:.92rem; line-height:1.45; }
  .err { background:#4a1512; color:#ff9d92; padding:10px 14px; border-radius:10px;
         font-size:.9rem; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>VHC DEMO BOARD — every scene wired to a real surface</h1>
  <span class="meta" id="meta">loading board…</span>
  <a href="vhc-tour.html" style="margin-left:auto;color:#9ec7ff;font-size:.85rem;
     font-weight:700;text-decoration:none">guided tour →</a>
</header>
<main>
  <div class="err" id="err"></div>
  <div class="disclaimer" id="disclaimer" style="display:none"></div>
  <div class="red" id="red" style="display:none"></div>
  <div id="scenes"></div>
</main>
<script>
// The board is generated data (board JSON from vhdemo --board-out),
// rendered as-is. A scene links only to a surface that exists; an
// unwired scene says so. Red findings pin to the top — a demo board
// that hides a red finding is complicit.
(async function () {
  const err = document.getElementById("err");
  let board;
  try {
    const resp = await fetch("vhc-demo-board.json", { cache: "no-store" });
    if (!resp.ok) throw new Error("board JSON HTTP " + resp.status +
      " — generate it: VHC_DEMO_BOARD=apps/pwa/vhc-demo-board.json bash demo/vhc-walkthrough.sh");
    board = await resp.json();
  } catch (e) {
    err.style.display = "block";
    err.textContent = String(e.message || e);
    return;
  }

  document.getElementById("meta").textContent =
    board.version + " · seed " + board.seed + " · " + board.audience +
    " · " + board.lang;

  const disc = document.getElementById("disclaimer");
  disc.textContent = board.disclaimer;
  disc.style.display = "block";

  if (board.red_findings && board.red_findings.length) {
    const red = document.getElementById("red");
    red.textContent = "STOP THE DEMO — " + board.red_findings.join("; ");
    red.style.display = "block";
  }

  const host = document.getElementById("scenes");
  board.scenes.forEach(function (s, i) {
    const el = document.createElement("section");
    el.className = "scene";
    const surface = s.link
      ? '<a href="' + s.link + '">' + s.link_label + " ↗</a>"
      : '<span class="unwired">surface not yet built — ' +
        "a cable not plugged in is not an interface</span>";
    el.innerHTML =
      '<h2><span class="num">' + (i + 1) + "</span>" + s.scene + "</h2>" +
      '<div class="surface">' + surface + "</div>" +
      "<ul>" + s.talking_points.map(function (tp) {
        const li = document.createElement("li");
        li.textContent = tp;
        return li.outerHTML;
      }).join("") + "</ul>";
    host.appendChild(el);
  });
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw-vhc.js").catch(()=>{});}</script>
</body>
</html>
