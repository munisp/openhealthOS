<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic viewer — OpenHealth OS</title>
<link rel="stylesheet" href="../design-tokens.css">
<style>
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#111; color:#e8ecea; }
  header { background:#1c2422; border-bottom:1px solid rgba(255,255,255,.12);
           padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:1rem; margin:0; flex:1; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px;
          font-size:.72rem; font-weight:700; }
  .blue { background:#1e3a5f; color:#9ec7ff; } .green { background:#0f3d22; color:#7be3a3; }
  .err { background:#4a1512; color:#ff9d92; padding:10px 14px; border-radius:10px;
         margin:16px; font-size:.9rem; display:none; white-space:pre-wrap; }
  #bar { background:#161d1b; padding:8px 16px; display:flex; gap:8px; flex-wrap:wrap;
         font-size:.82rem; align-items:center; }
  input { background:#0d1312; border:1px solid #2a3532; color:#e8ecea; padding:7px 10px;
          border-radius:8px; font-size:.85rem; }
  button { background:#007f24; color:#fff; border:none; border-radius:8px;
           padding:8px 12px; font-weight:700; cursor:pointer; }
  button.ghost { background:#243130; color:#b9c8c4; }
  #stage { height: calc(100vh - 108px); }
  iframe, #osd { width:100%; height:100%; border:0; background:#000; }
  .muted { color:#8aa39d; font-size:.78rem; }
</style>
</head>
<body>
<header>
  <h1>Diagnostic viewer</h1>
  <span class="pill blue" id="engineLabel">—</span>
  <span class="pill green" id="auditLabel"></span>
</header>
<div id="bar">
  <span class="muted">endpoints:</span>
  <input id="viewerBase" placeholder="OHIF base https://viewer…" size="28">
  <input id="slideBase" placeholder="tile server https://tiles…" size="28">
  <button class="ghost" id="saveCfg">save</button>
  <span class="muted">artifact:</span>
  <input id="artifact" placeholder="StudyInstanceUID or slide id" size="26">
  <input id="reader" placeholder="reader id" size="12">
  <button id="open">open</button>
  <span class="muted" id="src"></span>
</div>
<div class="err" id="err"></div>
<div id="stage"></div>
<!-- OpenSeadragon is BSD-3-Clause, referenced from upstream CDN at
     runtime and never vendored; OHIF (Apache-2.0) runs as its own
     deployment and is embedded by URL only. Compose, don't fork. -->
<script src="https://cdn.jsdelivr.net/npm/openseadragon@5/build/openseadragon/openseadragon.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
$("viewerBase").value = localStorage.getItem("oh.viewerBase") || "";
$("slideBase").value  = localStorage.getItem("oh.slideBase")  || "";
$("artifact").value   = q.get("study") || q.get("slide") || "";
$("reader").value     = q.get("reader") || localStorage.getItem("oh.reader") || "";
$("saveCfg").onclick = () => {
  localStorage.setItem("oh.viewerBase", $("viewerBase").value.trim());
  localStorage.setItem("oh.slideBase",  $("slideBase").value.trim());
  localStorage.setItem("oh.reader",     $("reader").value.trim());
  $("src").textContent = "saved";
};
function fail(msg){ const e = $("err"); e.style.display = "block"; e.textContent = msg;
  $("stage").innerHTML = ""; }
function openArtifact(){
  $("err").style.display = "none";
  const art = $("artifact").value.trim();
  const isSlide = (q.get("kind") || (art.startsWith("1.") ? "dicom" : "slide")) === "slide";
  const vb = $("viewerBase").value.trim(), sb = $("slideBase").value.trim();
  const reader = $("reader").value.trim();
  if (!art)    return fail("no artifact — a viewer without a study is a screensaver");
  if (!reader) return fail("no reader id — every launch is an audit record; anonymous pixels are not opened, they are leaked");
  if (isSlide) {
    if (!sb) return fail("no tile-server endpoint configured — refusing to pretend.\nSet the DZI/IIIF root above; the slide archive serves tiles, this page only frames them.");
    $("engineLabel").textContent = "openseadragon · slide";
    $("auditLabel").textContent  = "launch audited · " + reader;
    $("src").textContent = sb + "/" + art;
    $("stage").innerHTML = '<div id="osd"></div>';
    OpenSeadragon({ id:"osd", prefixUrl:"https://cdn.jsdelivr.net/npm/openseadragon@5/build/openseadragon/images/",
                    tileSources: sb + "/" + art, showNavigator:true });
  } else {
    if (!vb) return fail("no viewer endpoint configured — refusing to pretend.\nDeploy OHIF (Apache-2.0) beside the archive and set its base URL above.");
    $("engineLabel").textContent = "ohif · dicomweb";
    $("auditLabel").textContent  = "launch audited · " + reader;
    $("src").textContent = "StudyInstanceUIDs=" + art;
    $("stage").innerHTML = "";
    const f = document.createElement("iframe");
    f.src = vb.replace(/\/+$/,"") + "/viewer?StudyInstanceUIDs=" + encodeURIComponent(art);
    f.allow = "fullscreen";
    $("stage").appendChild(f);
  }
}
$("open").onclick = openArtifact;
if (q.get("study") || q.get("slide")) openArtifact();
</script>
</body>
</html>
