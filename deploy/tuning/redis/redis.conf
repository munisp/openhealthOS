# Redis 7 — cache + queue profile (JWKS warm standby, rate limits, outbox).
maxmemory 2gb
maxmemory-policy allkeys-lru          # caches evict; never OOM-kill the process
save ""                               # cache: no RDB snapshots; persistence lives in Postgres
appendonly no
tcp-backlog 511
timeout 300
# Alert threshold: evicted_keys > 0 means maxmemory is too small.
