# Postgres 16 — OLTP profile for the platform state plane.
# Target: tens of thousands of short transactions/sec, sync replica off-site.
shared_buffers = 4GB                  # 25% of RAM on a dedicated 16GB node
effective_cache_size = 12GB
work_mem = 16MB                       # small; hundreds of connections
maintenance_work_mem = 512MB
max_connections = 400                 # behind pgbouncer; never raise to absorb a leak
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 8GB
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200
jit = off                             # OLTP: jit compile cost exceeds win
log_min_duration_statement = 500      # slow-query feed into observability
shared_preload_libraries = 'pg_stat_statements'
