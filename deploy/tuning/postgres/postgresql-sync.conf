# postgresql-sync.conf — sync-substrate overlay for the OLTP profile.
#
# Load AFTER postgresql.conf:
#   postgres -c config_file=postgresql.conf
#   # include this file from postgresql.conf:
#   include = 'postgresql-sync.conf'
#
# This overlay is the Postgres side of the syncmesh@1.2.0 ceiling work:
# the WAL is the single-writer ceiling for uploads, and checkpoint
# fan-out is the read ceiling — both are tuned here, honestly, with
# each setting's reason stated. Nothing here weakens durability:
# synchronous_commit stays on; group commit (WalCoalescer) batches
# client transactions ABOVE the WAL, not below it.

# ── Logical decoding (PowerSync reads the WAL through a slot) ─────
wal_level = logical                 # already set by compose; stated here
                                    # so the overlay stands alone
max_wal_senders = 8                 # slots + replicas + pg_basebackup
max_replication_slots = 8           # PowerSync slot + replica slots +
                                    # headroom for a blue/green deploy
logical_decoding_work_mem = 256MB   # big sync batches decode in memory,
                                    # not spilled to disk mid-transaction

# ── WAL sizing: the write ceiling ─────────────────────────────────
# Sync storms write in bursts (ward mornings, connectivity returning).
# WAL must absorb a burst without forcing checkpoints mid-storm.
max_wal_size = 8GB                  # burst headroom between checkpoints
min_wal_size = 2GB                  # pre-allocated; no growth stall
checkpoint_timeout = 15min          # spread checkpoint I/O
checkpoint_completion_target = 0.9  # the checkpoint is a slope, not a cliff
wal_buffers = 64MB                  # group commits land in one write
wal_compression = on                # full-page images compress; storms
                                    # rewrite the same hot rows

# ── Slot discipline: the classic PowerSync-on-Postgres outage ─────
# A lagging slot pins WAL until the disk fills. The ceiling answer is
# two-sided: syncmesh.ReplicationSlotGuard refuses new sessions with a
# stated reason when lag exceeds budget (application side), and this
# setting is the last line of defence (database side) — a slot that
# falls hopelessly behind is dropped rather than taking the primary
# down with it. Sized for a replica that is offline a full weekend:
# 72h x ~20MB/min ward traffic ~= 84GB -> we cap at 100GB and alert
# LONG before, via the guard's stated refusals.
max_slot_wal_keep_size = 100GB

# ── Read fan-out: checkpoints are served by replicas ──────────────
# Device polling is read-only; the primary should carry only the WAL.
# hot_standby settings keep replicas able to serve long checkpoint
# queries while the WAL streams in.
hot_standby = on
hot_standby_feedback = on           # replicas tell the primary what
                                    # they still need — no mid-query
                                    # vacuum conflicts on long polls
max_standby_streaming_delay = 60s   # a checkpoint poll may be slow;
                                    # give it a minute before cancel
wal_receiver_status_interval = 5s   # lag visible quickly — the guard's
                                    # reader depends on fresh numbers
