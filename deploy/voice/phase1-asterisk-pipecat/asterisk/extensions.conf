; OpenHealth emergency line — one number, one job.
; All inbound emergency calls land here. Dialplan is deliberately tiny:
; DTMF 1 takes the fast path (no speech needed); anything else opens the
; conversational bridge over AudioSocket.

[openhealth-emergency]
exten => s,1,NoOp(emergency call from ${CALLERID(num)})
 same => n,Answer()
 ; Cell-tower fix, when the GSM gateway provides one, arrives as SIP
 ; headers; the bridge reads them via AUDIOHOOK_INHERIT or channel vars.
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Read(DIGIT,,1,,,8)          ; 8s for DTMF 1 (fast path)
 same => n,GotoIf($["${DIGIT}"="1"]?fastpath:converse)

 same => n(fastpath),AudioSocket(127.0.0.1:9092,${CALL_ID})
 ; the bridge sees the dtmf=1 frame and files immediately, then hangs up
 same => n,Hangup()

 same => n(converse),AudioSocket(127.0.0.1:9092,${CALL_ID})
 same => n,Hangup()
