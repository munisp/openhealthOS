; Minimal PJSIP: one trunk to the GSM gateway / SIP provider.
; Replace TRUNK_HOST and credentials per state deployment. TLS + SRTP are
; required for inter-state links; on a closed GSM gateway LAN, UDP is
; acceptable — document the choice per deployment.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[trunk]
type=endpoint
context=openhealth-emergency
disallow=all
allow=ulaw,alaw
aors=trunk
; outbound_auth=trunk-auth

[trunk]
type=aor
contact=sip:TRUNK_HOST:5060

[trunk]
type=identify
endpoint=trunk
match=TRUNK_HOST
