# LiveKit server (Apache-2.0) — national media fabric.
# The same fabric carries emergency voice rooms and telemedicine video rooms.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
keys:
  # Set via environment in real deployments; placeholder pair for compose dev.
  ${LK_API_KEY}: ${LK_API_SECRET}
sip:
  # SIP bridge connects here; inbound trunks defined in sip-trunk.json.
  listen_port: 5061
logging:
  level: info
turn:
  enabled: true
  domain: turn.STATE.example.ng   # per-state TURN for WebRTC/video callers
  tls_port: 5349
