# Kamailio edge (GPLv2) — national SIP perimeter for the emergency line.
# Jobs: DDoS/flood protection, per-trunk rate limiting, failover between
# GSM interconnects, then forward clean calls to LiveKit SIP. It does NOT
# do media or IVR — boring perimeter plumbing only.

#!KAMAILIO

debug=2
memlog=2
listen=udp:0.0.0.0:5060

loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "htable.so"
loadmodule "pike.so"          # flood detection

# ---- anti-flood: drop sources above 32 requests / 2s ----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 32)

# Upstream: LiveKit SIP listener
$var(upstream) = "sip:127.0.0.1:5061";

request_route {
    if (pike_check_req() < 0) {
        sl_send_reply("403", "Forbidden — flood");
        exit;
    }
    # only INVITEs for the emergency number cross the perimeter
    if (is_method("INVITE")) {
        rewritehostport("$var(upstream)");
        t_relay();
        exit;
    }
    if (is_method("REGISTER|OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }
    sl_send_reply("404", "Not here");
}
