;; PgBouncer in front of the platform Postgres (ADR-0044).
;;
;; Why this exists: nine Go services each open a connection pool against
;; one postgres:16. Postgres pays ~10 MB and a forked backend per
;; connection; 9 pools x 10 connections is ~90 backends doing nothing
;; most of the time, and the ceiling arrives exactly when a sync burst
;; hits. Transaction pooling collapses that to a handful of real
;; backends.

[databases]
openhealth = host=postgres port=5432 dbname=openhealth

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction mode: a server connection is held only for the duration
;; of a transaction. Our services are stdlib database/sql with no
;; session state (no SET, no advisory locks, no LISTEN/NOTIFY across
;; queries), so this is safe. max_prepared_statements stays 0 — the
;; Go pq driver tolerates that, and correctness beats convenience.
pool_mode = transaction
max_prepared_statements = 0

;; Sizing (matches deploy/tuning/postgres): 25 real backends max,
;; generous client side so a burst queues here instead of forking
;; postgres into swap.
max_client_conn = 1000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Idle hygiene: edge planes idle overnight; don't hold backends open.
server_idle_timeout = 120
server_lifetime = 1800
server_reset_query = DISCARD ALL
server_reset_query_always = 1

;; Observability: the admin console exposes SHOW POOLS / SHOW STATS,
;; scraped into the ADR-0040 plane by the postgres exporter sidecar.
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

log_connections = 0
log_disconnections = 0
