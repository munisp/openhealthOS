# Alert rules — platform + middleware + per-tenant (ADR-0040).
# Every rule carries a `tenant` label where the underlying series has one;
# Alertmanager routes on it (alertmanager.yml).

groups:
  - name: platform-services
    rules:
      - alert: ServiceErrorRateHigh
        expr: |
          sum by (service, tenant) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          sum by (service, tenant) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} 5xx rate >5% (tenant={{ $labels.tenant }})"

      - alert: ServiceLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (service, tenant, le) (rate(http_request_duration_ms_bucket[5m]))
          ) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 > 1s (tenant={{ $labels.tenant }})"

      - alert: TelemetryDropped
        expr: rate(otelcol_processor_dropped_spans[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "OTel collector is shedding spans — observability degraded"

  - name: middleware
    rules:
      - alert: PostgresConnectionsExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.85
        for: 5m
        labels: { severity: critical, component: postgres }
        annotations:
          summary: "Postgres using >85% of max_connections"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels: { severity: warning, component: postgres }

      - alert: RedisMemoryPressure
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels: { severity: critical, component: redis }

      - alert: RedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels: { severity: warning, component: redis }
        annotations:
          summary: "Redis evicting keys — cache/JWKS warm standby shrinking"

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 10m
        labels: { severity: warning, component: kafka }
        annotations:
          summary: "Kafka consumer group lag >10k ({{ $labels.consumergroup }})"

      - alert: OpenSearchClusterRed
        expr: opensearch_cluster_status == 2
        for: 1m
        labels: { severity: critical, component: opensearch }

  - name: per-tenant
    rules:
      # A tenant in trouble must be alertable on its own — a national
      # deployment cannot have one state's outage lost in the average.
      - alert: TenantErrorRateHigh
        expr: |
          sum by (tenant) (rate(http_requests_total{status=~"5.."}[5m]))
            /
          sum by (tenant) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "tenant {{ $labels.tenant }} 5xx rate >5% across services"

      - alert: TenantSilent
        expr: |
          sum by (tenant) (rate(http_requests_total[15m])) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "tenant {{ $labels.tenant }} has produced no traffic for 30m"
