# Prometheus — scrapes the OTel Collector's re-export endpoint (all
# middleware + service metrics, tenant label preserved) and evaluates the
# alert rules that feed Alertmanager (ADR-0040).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  # Collector self-telemetry: dropped spans, queue pressure.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
