# State data plane skeleton — one state, one namespace.
# Production adds: HA Postgres operator, Medplum FHIR server, Kafka, Temporal,
# Keycloak realm per state, APISIX ingress, NetworkPolicies, PodSecurity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-orchestrator
  namespace: oh-state-example
  labels: { app: claims-orchestrator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: claims-orchestrator }
  template:
    metadata:
      labels: { app: claims-orchestrator }
    spec:
      containers:
        - name: claims-orchestrator
          image: ghcr.io/munisp/openhealthos/claims-orchestrator:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: LISTEN, value: ":8080" }
            - { name: SWITCH, value: "http://payment-switch:9090" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-service
  namespace: oh-state-example
  labels: { app: registry-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: registry-service }
  template:
    metadata:
      labels: { app: registry-service }
    spec:
      containers:
        - name: registry-service
          image: ghcr.io/munisp/openhealthos/registry-service:latest
          ports: [{ containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-ingest
  namespace: oh-state-example
  labels: { app: sync-ingest }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sync-ingest }
  template:
    metadata:
      labels: { app: sync-ingest }
    spec:
      containers:
        - name: sync-ingest
          image: ghcr.io/munisp/openhealthos/sync-ingest:latest
          ports: [{ containerPort: 8443 }]
---
apiVersion: v1
kind: Service
metadata:
  name: claims-orchestrator
  namespace: oh-state-example
spec:
  selector: { app: claims-orchestrator }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: oh-state-example
spec:
  selector: { app: registry-service }
  ports: [{ port: 8081, targetPort: 8081 }]
