# Extended services plane (ADR-0036): the services added after the
# original nine. Same hardening contract: non-root, read-only root fs,
# dropped capabilities, fail-closed auth, seccomp RuntimeDefault.
# claims-orchestrator, registry-service and sync-ingest live in
# state-plane.yaml. emptyDir journals are demo-grade - mount PVCs in production.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-service
  namespace: oh-state-example
  labels: { app: scheduling-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: scheduling-service }
  template:
    metadata:
      labels: { app: scheduling-service }
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: scheduling-service
          image: ghcr.io/munisp/openhealthos/scheduling-service:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8092 }]
          env:
            - { name: LISTEN, value: ":8092" }
            - { name: AUTH_REQUIRED, value: "1" }  # fail closed, ADR-0013
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef: { name: openhealth-idp, key: issuer }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: openhealth-db, key: url }
            - { name: NOTIFY_URL, value: "http://notification-service:8089" }
            - { name: ELIGIBILITY_URL, value: "http://claims-orchestrator:8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8092 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
