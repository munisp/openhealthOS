# Application services plane — complements state-plane.yaml (claims,
# registry, sync-ingest). One state, one namespace. Production hardening
# (HA Postgres operator, NetworkPolicies, PodSecurity, ingress) is listed
# in state-plane.yaml and applies here unchanged.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-service
  namespace: oh-state-example
  labels: { app: consent-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: consent-service }
  template:
    metadata:
      labels: { app: consent-service }
    spec:
      containers:
        - name: consent-service
          image: ghcr.io/munisp/openhealthos/consent-service:latest
          ports: [{ containerPort: 8082 }]
          env:
            - { name: LISTEN, value: ":8082" }
            - name: CONSENT_HMAC_KEY
              valueFrom:
                secretKeyRef: { name: consent-keys, key: hmac-key }
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shr-service
  namespace: oh-state-example
  labels: { app: shr-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shr-service }
  template:
    metadata:
      labels: { app: shr-service }
    spec:
      containers:
        - name: shr-service
          image: ghcr.io/munisp/openhealthos/shr-service:latest
          ports: [{ containerPort: 8085 }]
          env:
            - { name: LISTEN, value: ":8085" }
            - { name: CONSENT_URL, value: "http://consent-service:8082" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
