apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: oh-state-example
  labels: { app: wallet-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wallet-service }
  template:
    metadata:
      labels: { app: wallet-service }
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - { name: tmp, emptyDir: {} }
        # Money at rest: use a PVC in production; emptyDir is demo-grade only.
        - { name: ledger-data, emptyDir: {} }
      containers:
        - name: wallet-service
          image: ghcr.io/munisp/openhealthos/wallet-service:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: ledger-data, mountPath: /var/lib/openhealth/ledger }
          ports: [{ containerPort: 8084 }]
          env:
            - { name: LISTEN, value: ":8084" }
            - { name: AUTH_REQUIRED, value: "1" }  # fail closed, ADR-0013
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef: { name: openhealth-idp, key: issuer }
            - { name: LEDGER, value: "/usr/local/bin/oh_ledger" }
            - { name: LEDGER_DATA_DIR, value: /var/lib/openhealth/ledger }
            # Money-movement idempotency table (0006) lives in the state plane.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: openhealth-db, key: url }
          readinessProbe:
            httpGet: { path: /healthz, port: 8084 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
