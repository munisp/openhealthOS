apiVersion: apps/v1
kind: Deployment
metadata:
  name: ussd-gateway
  namespace: oh-state-example
  labels: { app: ussd-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ussd-gateway }
  template:
    metadata:
      labels: { app: ussd-gateway }
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: ussd-gateway
          image: ghcr.io/munisp/openhealthos/ussd-gateway:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8083 }]
          env:
            - { name: LISTEN, value: ":8083" }
            # Clinic-updates feed (menu option 3): reads the notification
            # rail's patient feed; unset fails safe (menu explains instead).
            - { name: NOTIFY_URL, value: "http://notification-service:8089" }
            # no AUTH_REQUIRED here: USSD is telco-terminated; identity is the
            # presented MSISDN, and replies never carry clinical detail.
          readinessProbe:
            httpGet: { path: /healthz, port: 8083 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
