# Application services plane — complements state-plane.yaml (claims,
# registry, sync-ingest). One state, one namespace. Production hardening
# (HA Postgres operator, NetworkPolicies, PodSecurity, ingress) is listed
# in state-plane.yaml and applies here unchanged.
---
# The platform's single public entry (ADR-0009). Only these pods are
# reachable from the ingress namespace — see hardening.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: oh-state-example
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: api-gateway
          image: ghcr.io/munisp/openhealthos/api-gateway:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8000 }]
          env:
            - { name: LISTEN, value: ":8000" }
            - { name: AUTH_REQUIRED, value: "1" }  # fail closed, ADR-0013
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef: { name: openhealth-idp, key: issuer }
            - { name: CLAIMS_URL, value: "http://claims-orchestrator:8080" }
            - { name: REGISTRY_URL, value: "http://registry-service:8081" }
            - { name: CONSENT_URL, value: "http://consent-service:8082" }
            - { name: USSD_URL, value: "http://ussd-gateway:8083" }
            - { name: WALLET_URL, value: "http://wallet-service:8084" }
            - { name: SHR_URL, value: "http://shr-service:8085" }
            - { name: EQUIPMENT_URL, value: "http://equipment-service:8086" }
            - { name: TELEHEALTH_URL, value: "http://telehealth-service:8087" }
            # Extended plane (ADR-0036, services-plane-extended.yaml)
            - { name: SCHEDULING_URL, value: "http://scheduling-service:8092" }
            - { name: DISPATCH_URL, value: "http://dispatch-service:8093" }
            - { name: TELEMED_URL, value: "http://telemed-service:8094" }
            - { name: MEDIA_URL, value: "http://media-service:8095" }
            - { name: IMAGING_URL, value: "http://imaging-service:8096" }
            - { name: TRAINING_URL, value: "http://training-service:8097" }
            - { name: IPD_URL, value: "http://ipd-service:8098" }
            - { name: WELLNESS_URL, value: "http://wellness-service:8090" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
