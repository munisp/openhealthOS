# Cilium values for OpenHealth OS state planes (ADR-0043).
#
#   helm install cilium cilium/cilium -n kube-system -f values.yaml
#
# Scope: the k8s state/services planes ONLY. Facility edge nodes run
# bare docker-compose on 4-core boxes — Cilium/eBPF adds nothing there
# and we do not pretend otherwise.
#
# Kernel: any modern Ubuntu/Debian kernel (>= 5.10) on the state-plane
# nodes supports everything below. No GPL contamination concern: Cilium
# is Apache-2.0; eBPF programs load into the kernel at runtime, they are
# not linked into our binaries.

# kube-proxy replacement: eBPF datapath, no iptables chains. On a plane
# running sync-ingest at ~200k events/s, per-service iptables rules are
# real latency; eBPF maps are O(1).
kubeProxyReplacement: true
k8sServiceHost: REPLACE_WITH_API_SERVER_HOST   # set per state plane
k8sServicePort: 6443

# Battle-hardening: default-deny is policy (network-policies.yaml), and
# the datapath must enforce it in both directions.
enablePolicy: "always"
policyEnforcementMode: default

# Hubble: flow visibility + service map. Feeds the ADR-0040 observability
# plane — network truth next to application spans.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true   # scraped by the plane's existing Prometheus

# eBPF host firewall: node-level policy, not just pod-level.
hostFirewall:
  enabled: true

# WireGuard transparent encryption pod-to-pod. State planes handle PHI
# across nodes; mTLS at the app layer (ADR-0025) stays — this is the
# belt-and-braces network layer for anything that misses the proxy.
encryption:
  enabled: true
  type: wireguard

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Resource discipline: these planes also carry Postgres and ingest.
# Keep the agent modest.
resources:
  limits:   { cpu: 500m, memory: 512Mi }
  requests: { cpu: 100m, memory: 128Mi }
