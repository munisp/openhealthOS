# Platform plane — the OpenHealth OS application services, containerised.
#
# Complements docker-compose.yaml (infrastructure plane: Postgres, MinIO,
# Keycloak, observability). All application services are stdlib-only Go
# built from the shared Dockerfile.go-service; the money-path services
# (claims-orchestrator, wallet-service) carry the Rust ledger and Python
# adjudicator in-image via their dedicated Dockerfiles.
#
#   docker compose -f infra/compose/platform.yaml up --build
#
# Ports are host-mapped to the 180xx range to avoid clashing with anything
# already on 8080. payment-switch is the FSPIOP-shaped mock — a test
# fixture, never a production settlement rail (swap for the real switch).
#
# Edge components (sync-agent) run on facility devices, not in this plane.

services:
  # State-plane Postgres (schema: db/migrations/0001_init.sql, idempotent).
  # Duplicated from the infra plane so this plane boots standalone; in a
  # single-project deployment, share one postgres instead.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: openhealth-dev
      POSTGRES_DB: openhealth
    ports: ["15432:5432"]
    volumes: ["platform-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["../../db/migrations:/migrations:ro"]
    command: >
      sh -c "psql postgresql://postgres:openhealth-dev@postgres:5432/openhealth
             -v ON_ERROR_STOP=1 -f /migrations/0001_init.sql
             && psql postgresql://postgres:openhealth-dev@postgres:5432/openhealth
             -v ON_ERROR_STOP=1 -f /migrations/0002_telehealth_equipment.sql
             && psql postgresql://postgres:openhealth-dev@postgres:5432/openhealth
             -v ON_ERROR_STOP=1 -f /migrations/0003_pharmacy.sql
             && psql postgresql://postgres:openhealth-dev@postgres:5432/openhealth
             -v ON_ERROR_STOP=1 -f /migrations/0004_notifications.sql
      && psql "$DATABASE_URL"
             -v ON_ERROR_STOP=1 -f /migrations/0005_registry_kyc.sql"

  # OIDC issuer for the gateways (ADR-0006): create the 'openhealth' realm,
  # then uncomment OIDC_ISSUER on shr-service / claims-orchestrator below.
  # Realm is code: infra/keycloak/realm-openhealth.json imports at boot
  # (roles, facility_id claim mapper, edge app + gateway clients).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: openhealth-dev
    volumes: ["../../infra/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["18088:8080"]

  payment-switch:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: payment-switch-mock }
    environment: { LISTEN: ":9090" }
    ports: ["19090:9090"]

  claims-orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.claims-orchestrator
    environment:
      LISTEN: ":8080"
      SWITCH: http://payment-switch:9090
      LEDGER_DATA_DIR: /var/lib/openhealth/ledger  # durable journal+snapshot (ADR-0007)
      # OIDC_ISSUER: http://keycloak:8080/realms/openhealth  # uncomment after realm setup
    volumes: ["ledger-claims:/var/lib/openhealth/ledger"]
    ports: ["18080:8080"]
    depends_on: [payment-switch]

  registry-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: registry-service }
    environment:
      LISTEN: ":8081"
      DATABASE_URL: postgres://postgres:openhealth-dev@postgres:5432/openhealth
    ports: ["18081:8081"]
    depends_on: [migrate]

  consent-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: consent-service }
    environment:
      LISTEN: ":8082"
      CONSENT_HMAC_KEY: dev-only-not-secret
      DATABASE_URL: postgres://postgres:openhealth-dev@postgres:5432/openhealth
    ports: ["18082:8082"]
    depends_on: [migrate]

  shr-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: shr-service }
    environment:
      LISTEN: ":8085"
      CONSENT_URL: http://consent-service:8082
      DATABASE_URL: postgres://postgres:openhealth-dev@postgres:5432/openhealth
      # OIDC_ISSUER: http://keycloak:8080/realms/openhealth  # uncomment after realm setup
    ports: ["18085:8085"]
    depends_on: [consent-service, migrate]

  telehealth-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: telehealth-service }
    environment:
      LISTEN: ":8087"
      SHR_URL: http://shr-service:8085        # FHIR Encounter/MedicationRequest writes
      PHARMACY_URL: http://pharmacy-service:8088  # prescription routing
    ports: ["18087:8087"]
    depends_on: [shr-service, pharmacy-service]

  pharmacy-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: pharmacy-service }
    environment: { LISTEN: ":8088" }
    ports: ["18088:8088"]

  wallet-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.wallet-service
    environment:
      LISTEN: ":8084"
      LEDGER_DATA_DIR: /var/lib/openhealth/ledger
    volumes: ["ledger-wallet:/var/lib/openhealth/ledger"]
    ports: ["18084:8084"]

  equipment-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: equipment-service }
    environment: { LISTEN: ":8086" }
    ports: ["18086:8086"]

  ussd-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: ussd-gateway }
    environment: { LISTEN: ":8083" }
    ports: ["18083:8083"]

  sync-ingest:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: sync-ingest }
    environment:
      LISTEN: ":8443"
      DATABASE_URL: postgres://postgres:openhealth-dev@postgres:5432/openhealth
    ports: ["18443:8443"]
    depends_on: [migrate]

  # Single public entry: all external traffic enters through the gateway;
  # per-service ports above are for development convenience only.
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: api-gateway }
    environment:
      LISTEN: ":8000"
      CLAIMS_URL: http://claims-orchestrator:8080
      REGISTRY_URL: http://registry-service:8081
      CONSENT_URL: http://consent-service:8082
      USSD_URL: http://ussd-gateway:8083
      WALLET_URL: http://wallet-service:8084
      SHR_URL: http://shr-service:8085
      EQUIPMENT_URL: http://equipment-service:8086
      TELEHEALTH_URL: http://telehealth-service:8087
      PHARMACY_URL: http://pharmacy-service:8088
      NOTIFY_URL: http://notification-service:8089
      SYNC_URL: http://sync-ingest:8443
      APPS_ROOT: /srv/openhealth/apps   # serves /app (PWA) and /dash (boards)
      # OIDC_ISSUER: http://keycloak:8080/realms/openhealth  # uncomment to enforce
    volumes:
      - ../../apps:/srv/openhealth/apps:ro
    ports: ["8000:8000"]
    depends_on: [claims-orchestrator, registry-service, consent-service, shr-service, sync-ingest]

  # Outbound patient-contact rail (ADR-0011): appointment/result/pickup/
  # referral/immunisation SMS driven by domain events. Log provider by
  # default; set SMS_WEBHOOK_URL to a real aggregator in deployment.
  notification-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go-service
      args: { MODULE: notification-service }
    environment:
      LISTEN: ":8089"
      DATABASE_URL: postgres://postgres:openhealth-dev@postgres:5432/openhealth
      # SMS_WEBHOOK_URL: https://aggregator.example/send
    ports: ["18089:8089"]
    depends_on: [migrate]

  # ── Medplum FHIR foundation (profile-gated) ─────────────────────────
  # The designated production FHIR core (ADR-0002/ADR-0010): full R4
  # search, subscriptions, bots, compartments. shr-service remains the
  # lightweight contract-compatible seam for edge/dev; Medplum is the
  # deployment target behind the same envelope contract. Profile-gated
  # so the default plane stays lean:
  #
  #   docker compose -f infra/compose/platform.yaml --profile medplum up --build
  #
  # First boot takes a few minutes (DB migrations + seed). Health:
  #   curl localhost:18103/healthcheck
  # Then validate the OpenHealth profiles against it:
  #   python3 tools/medplum-validate/main.py
  medplum-db:
    image: postgres:16-alpine
    profiles: ["medplum"]
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum-dev
      POSTGRES_DB: medplum
    volumes: ["medplum-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplum"]
      interval: 5s

  medplum-redis:
    image: redis:7-alpine
    profiles: ["medplum"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  medplum:
    image: medplum/medplum-server:latest
    profiles: ["medplum"]
    environment:
      MEDPLUM_BASE_URL: http://localhost:18103/
      MEDPLUM_PORT: 8103
      MEDPLUM_DATABASE_HOST: medplum-db
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: medplum-dev
      MEDPLUM_REDIS_HOST: medplum-redis
      MEDPLUM_REDIS_PORT: 6379
    ports: ["18103:8103"]
    depends_on:
      medplum-db: { condition: service_healthy }
      medplum-redis: { condition: service_healthy }

volumes:
  platform-pgdata:
  ledger-claims:
  ledger-wallet:
  medplum-pgdata:
